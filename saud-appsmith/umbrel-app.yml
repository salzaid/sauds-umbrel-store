releaseNotes: "Appsmith 2.4.2 keeps the automatic migration for older Umbrel installs, so Appsmith may take some time to come back online while the migration finishes. Please leave Appsmith running until it has started.\nAppsmith AI reaches end of life on September 30, 2026. Existing Appsmith AI queries stop working on that date, whether or not you upgrade. Migrate remaining Appsmith AI queries to direct provider datasources such as OpenAI, Anthropic, or Google AI.\nThis update includes security fixes for bundled dependencies, including Bouncy Castle.\nHighlights include:\n  - Fixed a page-cloning issue that could load large page documents once per action and exhaust server memory.\n  - Reduced overcounting in Segment usage events.\n  - Restored Ask AI visibility for Developer-role users.\n  - Improved OAuth2 datasource field layout and form-login cache handling.\n\nFull release notes can be found at https://github.com/appsmithorg/appsmith/releases/tag/v2.4.2"
