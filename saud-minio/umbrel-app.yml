tagline: Install from the official Umbrel App Store (The Object Store for AI Data Infrastructure)
description: |
  This is a disabled mirror of the official `minio` app. Install MinIO from the official Umbrel App Store instead: it is maintained, updated and tested there.

  The mirror is kept only so this store's catalog stays complete. If you ever enable it, it uses its own app id and port 5446 so it cannot collide with the official app.

  MinIO is a high-performance, S3 compatible object store. It is built for large scale AI/ML, data lake and database workloads. It is software-defined and runs on any cloud or on-premises infrastructure. MinIO is dual-licensed under open source GNU AGPL v3 and a commercial enterprise license.

  Understand the Features that Make MinIO the Industry's Most Widely Deployed Object Store:

    - Bucket & Object Immutability
    - Encryption
    - Active Active Replication for Object Storage
    - Automated Data Management Interfaces
    - Object Storage Built for S3
    - Data Life Cycle Management & Tiering
    - Scalable Object Storage
    - Identity & Access Management
