description: |
  A self-hosted GitHub Actions runner. It has no web interface and needs a repository URL and a registration token, so it is disabled by default.

  To use it: fork the store, fill in RUNNER_REPO_URL and RUNNER_TOKEN in exports.sh, remove disabled: true, and push. The runner can control Docker on your Umbrel, so only connect repositories you trust.
