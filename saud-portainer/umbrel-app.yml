defaultPassword: "changeme"
releaseNotes: "Portainer 2.45.1 LTS includes security hardening, dependency updates, and UI fixes.\n\nHighlights include:\n  - Hardened outbound Helm and Git HTTP/HTTPS requests against SSRF bypasses\n  - Updated Go, gRPC, kubectl, Helm, Alpine packages, and other components to address CVEs\n  - Disabled certificate-based Azure Blob backup authentication in FIPS mode\n  - Simplified environment stat cards and clarified GitOps stack settings copy\n  - Fixed Swarm network rendering, Kubernetes node application listings, Helm registry credential cache invalidation, and Edge Updater status sorting\n\n\nFull release notes can be found at https://github.com/portainer/portainer/releases/tag/2.45.1."
