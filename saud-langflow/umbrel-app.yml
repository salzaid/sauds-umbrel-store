releaseNotes: "Adds an Assistant slash-command menu and a larger 100-step Assistant run budget.\n\nImproves Assistant, MCP server, OpenSearch, Knowledge Base, export, and provider-package handling.\n\nAdds security hardening for SSRF checks, code scanning, component publishing, result caching, flow ZIP imports, local file access, and several sandbox escape paths.\n\nFixes credential redaction in settings errors and console tracebacks."
