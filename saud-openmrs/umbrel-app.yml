description: |
  The OpenMRS 3 reference application (backend, O3 frontend and gateway) with MariaDB. It includes demo patients and is meant for training.

  The first start builds the database and can take 10 to 20 minutes. Log in with admin / Admin123 and change the password.

  The containers run on a private network because the upstream gateway uses the fixed host names frontend and backend.
