version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: saud-open-terminal_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/open-webui/open-terminal:0.16.6@sha256:9d2ce201c46da381449dab90e0c3b0fe83bd56263ea3c31631820736971a2089
    restart: on-failure
    stop_grace_period: 30s
    shm_size: "1gb"
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      # Uses the per-app password generated by Umbrel (viewable under "Show default credentials")
      OPEN_TERMINAL_API_KEY: ${APP_PASSWORD}
      OPEN_TERMINAL_CORS_ALLOWED_ORIGINS: "*"
      OPEN_TERMINAL_ENABLE_TERMINAL: "true"
      OPEN_TERMINAL_ENABLE_NOTEBOOKS: "true"
      OPEN_TERMINAL_ENABLE_BROWSER: "true"
      OPEN_TERMINAL_ENABLE_DESKTOP: "true"
      OPEN_TERMINAL_BROWSER_NO_SANDBOX: "true"
      TZ: Asia/Kuwait
      # Optional: space-separated extra packages installed on container startup
      # OPEN_TERMINAL_PACKAGES: ""
      # OPEN_TERMINAL_PIP_PACKAGES: ""
      # OPEN_TERMINAL_NPM_PACKAGES: ""
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/home/user
