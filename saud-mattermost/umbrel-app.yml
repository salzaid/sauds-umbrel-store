releaseNotes: "Mattermost 11.11.0 adds recurring scheduled posts, channel browsing improvements, and updated bundled Boards, GitHub, Jira, Calls, and Agents plugins.\n\nThis release also improves administration and compliance workflows, including Data Spillage Handling, token audit logging, system bot recovery, policy simulation, and additional warnings for insecure production settings.\n\nMattermost includes no-downtime database schema changes for scheduled posts, scheduled recaps, and channel type support. It also carries forward the FIPS-only database password length caveat; standard Umbrel installs are unaffected.\n\nFull release notes can be found at https://docs.mattermost.com/product-overview/mattermost-v11-changelog.html#release-v11-11-feature-release"
