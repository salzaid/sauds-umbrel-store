releaseNotes: "This update adds support for new storage management and configuration options being introduced with umbrelOS 2.0.\n\nPrevious Grafana 13.2.2 release notes:\n\n⚠️ If you're updating from before Grafana 13.1, Prometheus Azure/SigV4 authentication and the Zipkin core plugin were removed from Grafana core. Review the upstream notes if you use those integrations.\n\nGrafana 13.2.2 includes security fixes for CVE-2026-15815, CVE-2026-76154, and CVE-2026-79656.\n\nThis release also fixes dashboard import query variable refresh settings and folder rename UID collisions during provisioning sync.\n\nFull release notes can be found at https://github.com/grafana/grafana/releases/tag/v13.2.2"
