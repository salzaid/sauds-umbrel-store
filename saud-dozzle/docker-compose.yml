version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: saud-dozzle_web_1
      APP_PORT: 8080
  web:
    image: amir20/dozzle:v11.1.1@sha256:c90494cbc3a9ca959634b89fdb3fdecbcbae1f690d7a567d0d356c6fda1d957c
    restart: on-failure
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: 'true'
      DOZZLE_ENABLE_ACTIONS: 'false'
