description: |
  Synthea generates realistic but fully synthetic patient records (FHIR R4 bundles and CSV). On each app start it generates a population of 100 patients into the output folder, which you can browse and download here.

  The first start downloads the pinned Synthea 4.0.0 release (about 200 MB) and checks its SHA-256. Restart the app to generate another population.
