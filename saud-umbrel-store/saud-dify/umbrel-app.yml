description: |
  Dify 1.17 needs about ten cooperating containers (API, worker, beat, web, sandbox, plugin daemon, SSRF proxy, nginx, vector store, database, cache) with hard-coded service names and many env files. That cannot be packaged reliably as an Umbrel app without testing on hardware.

  This entry is disabled. Run Dify with its own docker compose files, for example as a Portainer stack, or use Flowise from this store.
