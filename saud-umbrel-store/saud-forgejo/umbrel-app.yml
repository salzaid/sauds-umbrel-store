releaseNotes: "Forgejo 16.0.5 is a security and bug-fix release. It fixes a critical patch-application issue that could allow remote code execution on the Forgejo host, and fixes a CSRF issue affecting OpenID identity association.\n\nThis release also improves Forgejo's update checker support for LTS and multiple release channels, fixes organization visibility/API updates, and corrects Arch Linux package validation.\n\nIf you're updating from a pre-16.0 version, existing repositories remain compatible, and admins can optionally follow Forgejo's upgrade guide to clean up old per-repository hook/example files after making a backup.\n\nIf you manually enabled Forgejo reverse proxy authentication on your Umbrel, review Forgejo's trusted-proxy configuration guidance before upgrading.\n\nFull release notes are available at https://codeberg.org/forgejo/forgejo/releases/tag/v16.0.5"
