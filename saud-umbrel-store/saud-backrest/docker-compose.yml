version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: saud-backrest_web_1
      APP_PORT: 9898
      PROXY_AUTH_ADD: "false"
  web:
    image: garethgeorge/backrest:v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
    restart: on-failure
    hostname: umbrel-backrest
    environment:
      BACKREST_PORT: 0.0.0.0:9898
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
    volumes:
    - ${APP_DATA_DIR}/data/data:/data
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/cache:/cache
    - ${APP_DATA_DIR}/data/repos:/repos
    - ${UMBREL_ROOT}/home:/userdata:ro
