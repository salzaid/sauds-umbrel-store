version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: saud-open-notebook_web_1
      APP_PORT: 8502
      PROXY_AUTH_ADD: "true"
      # Umbrel login protects the UI; /api/* is let through (otherwise the proxy
      # redirects the browser's fetch calls to the Umbrel login -> "Failed to fetch").
      # The API is protected by Open Notebook's own password instead (below).
      PROXY_AUTH_WHITELIST: "/api/*"

  db:
    image: surrealdb/surrealdb:v2.3.10
    user: "0:0"
    restart: on-failure
    command: ["start", "--log", "info", "--user", "root", "--pass", "${APP_SEED}", "rocksdb:/mydata/mydatabase.db"]
    volumes:
      - ${APP_DATA_DIR}/data/surreal:/mydata
    environment:
      SURREAL_EXPERIMENTAL_GRAPHQL: "true"

  web:
    image: lfnovo/open_notebook:1.15.0
    restart: on-failure
    depends_on:
      - db
    volumes:
      - ${APP_DATA_DIR}/data/notebook:/app/data
    environment:
      # Browser sends API calls to the same address/port as the UI (Umbrel app proxy on 8502);
      # Next.js inside the container forwards /api/* to the API on localhost:5055.
      # Must match exactly how you open Umbrel in the browser (hostname or IP).
      API_URL: http://littlefucker.local:8502
      INTERNAL_API_URL: http://localhost:5055
      # App login password = the password Umbrel shows on the app page
      OPEN_NOTEBOOK_PASSWORD: ${APP_PASSWORD}
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${APP_SEED}
      SURREAL_URL: ws://saud-open-notebook_db_1:8000/rpc
      SURREAL_USER: root
      SURREAL_PASSWORD: ${APP_SEED}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      # One task at a time is kinder to a single local GPU / Ollama
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: "1"
