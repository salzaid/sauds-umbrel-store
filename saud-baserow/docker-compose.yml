version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: saud-baserow_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  web:
    image: baserow/baserow:2.3.4@sha256:97e1818daf5dd64a0a8f7069db4199c2a79b9234cff450b60d97fc99b8c4ab39
    restart: on-failure
    stop_grace_period: 1m
    environment:
      BASEROW_PUBLIC_URL: http://${DEVICE_DOMAIN_NAME}:5430
      BASEROW_ENABLE_OTEL: 'false'
    volumes:
    - ${APP_DATA_DIR}/data/baserow:/baserow/data
