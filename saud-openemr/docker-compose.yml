version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: saud-openemr_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  web:
    image: openemr/openemr:8.4.1@sha256:def4d28786e5181860cb4a4598b367f1a63fb269a7c6b7e39e5855adb4f1a1f2
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: saud-openemr_db_1
      MYSQL_ROOT_PASS: ${APP_PASSWORD}
      MYSQL_USER: openemr
      MYSQL_PASS: ${APP_PASSWORD}
      OE_USER: admin
      OE_PASS: ${APP_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data/sites:/var/www/localhost/htdocs/openemr/sites
    - ${APP_DATA_DIR}/data/logs:/var/log
  db:
    image: mariadb:11.8.9@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    environment:
      MARIADB_DATABASE: openemr
      MARIADB_USER: openemr
      MARIADB_PASSWORD: ${APP_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${APP_PASSWORD}
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 20
