version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: saud-lemonade_server_1
      APP_PORT: "13305"

  init:
    image: ghcr.io/lemonade-sdk/lemonade-server:v2026.39.1@sha256:583130946a9f57dada3e42ac047c2b842d56e041bbb5e6d38422e38746ce49eb
    user: "0:0"
    restart: "no"
    entrypoint:
      - chown
      - -R
      - lemonade:lemonade
      - /opt/lemonade/.cache/huggingface
      - /opt/lemonade/llama
      - /opt/lemonade/.cache/lemonade
      - /opt/lemonade/.config/lemonade
    volumes:
      - ${APP_DATA_DIR}/data/hf:/opt/lemonade/.cache/huggingface
      - ${APP_DATA_DIR}/data/llama:/opt/lemonade/llama
      - ${APP_DATA_DIR}/data/cache:/opt/lemonade/.cache/lemonade
      - ${APP_DATA_DIR}/data/config:/opt/lemonade/.config/lemonade

  server:
    image: ghcr.io/lemonade-sdk/lemonade-server:v2026.39.1@sha256:583130946a9f57dada3e42ac047c2b842d56e041bbb5e6d38422e38746ce49eb
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      LEMONADE_HOST: "0.0.0.0"
      LEMONADE_PORT: "13305"
      LEMONADE_ALLOWED_ORIGINS: "*"
    volumes:
      - ${APP_DATA_DIR}/data/hf:/opt/lemonade/.cache/huggingface
      - ${APP_DATA_DIR}/data/llama:/opt/lemonade/llama
      - ${APP_DATA_DIR}/data/cache:/opt/lemonade/.cache/lemonade
      - ${APP_DATA_DIR}/data/config:/opt/lemonade/.config/lemonade
